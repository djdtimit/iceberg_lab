# Unity Catalog OSS 0.7.0, PERMISSION instance "unitycatalog-authz" (compose profile "unity",
# tests/test_authz.py). Same as unity/server.properties, but with authorization on: tokens come
# from token exchange with Keycloak (realm "iceberg"); the user is the one whose external id
# equals the token's client id (unity/token_shim.py does the exchange for the engines).
server.env=dev
server.authorization=enable
server.allowed-issuers=http://keycloak:8080/realms/iceberg
# Only tokens issued for Unity (Keycloak audience mapper 'audience-unity', realm.json);
# '*' would accept a token issued for any other service of the realm.
server.audiences=unity

aws.accessKey=rustfsadmin
aws.secretKey=rustfsadmin
aws.region=us-east-1
aws.masterRoleArn=arn:aws:iam::123456789012:role/uc-master
