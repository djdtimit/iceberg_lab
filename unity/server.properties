# Unity Catalog OSS 0.7.0 for the lab (compose profile "unity"). Single-user lab server:
# authorization disabled - never use this for a shared server.
server.env=dev
server.authorization=disable

# The identity UC signs AWS calls with (STS AssumeRole for credential vending). Unity has no
# endpoint override, so it talks to the real AWS host names; the lab gateway (unity/envoy.yaml)
# answers them and forwards to RustFS (S3) and the STS shim (unity/sts_shim.py).
aws.accessKey=rustfsadmin
aws.secretKey=rustfsadmin
aws.region=us-east-1
aws.masterRoleArn=arn:aws:iam::123456789012:role/uc-master
