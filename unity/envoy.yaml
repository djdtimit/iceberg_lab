# AWS-emulating gateway for Unity Catalog (compose profile "unity").
#
# Unity Catalog OSS has no S3/STS endpoint override: it calls the real AWS host names over
# HTTPS. In the compose network this gateway owns those names (network aliases, see
# docker-compose.yml), terminates TLS with a local CA (unity/certs.sh) and forwards:
#   sts.*.amazonaws.com            -> unity-sts-shim:8080 (rewrites the session policy, re-signs)
#   s3 / <bucket>.s3.*.amazonaws.com -> rustfs:9000 (Host header unchanged: part of SigV4)
# Engines do NOT use this gateway: they get vended keys and talk to rustfs:9000 directly.
# Based on the Unity Catalog docs environment (unitycatalog.io/docs/env/uc-aws.tar.gz).

static_resources:
  listeners:
    - name: emulated_tls
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/leaf.pem }
                    private_key: { filename: /certs/leaf-key.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: emulated_tls
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%REQ(:AUTHORITY)% %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                route_config:
                  name: emulated_tls_route
                  virtual_hosts:
                    - name: sts-shim
                      domains:
                        - "sts.amazonaws.com"
                        - "sts.amazonaws.com:443"
                        - "sts.us-east-1.amazonaws.com"
                        - "sts.us-east-1.amazonaws.com:443"
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: sts-shim, timeout: 0s }
                    - name: rustfs
                      domains: ["*"]
                      response_headers_to_add:
                        - header: { key: "x-amz-bucket-region", value: "us-east-1" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: rustfs, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: rustfs
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: rustfs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: rustfs, port_value: 9000 } }
    - name: sts-shim
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: sts-shim
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: unity-sts-shim, port_value: 8080 } }
