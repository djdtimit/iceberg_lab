# Gap register: one entry per cause of a known gap (src/iceberg_lab/lab/gap_register.py).
# Tests point here by id. Fields: summary, severity (DATA LOSS | DATA CORRUPTION |
# INCONSISTENT | WRONG RESULT | SECURITY), seen_at (component -> version last reproduced),
# flaky, bug_report (docs/bug-reports/), upstream. The id starts with the owning component
# (pglake- for pg_lake) or catalogs-/engines- for a cause shared by several.
# `uv run python scripts/gap_register.py confirm` moves seen_at forward after a full run.

# ============================== lakekeeper

[lakekeeper-dotdot-table-name]
summary = "Lakekeeper accepts a table named '..'; HTTP clients must remove '..' path segments (RFC 3986), so the table can only be reached percent-encoded (%2E%2E) - Polaris, RustFS and Unity refuse the name"
seen_at = { lakekeeper = "0.15.1" }

[lakekeeper-error-body-empty]
summary = "Lakekeeper answers a path it does not have (404) or a method a path does not support (405) with an empty body - no Iceberg error document (Iceberg clients cannot parse the error; same as unitycatalog#1835)"
seen_at = { lakekeeper = "0.15.1" }
bug_report = "13-lakekeeper-error-bodies-and-snapshots-param.md"

[lakekeeper-functions-unregister-404]
summary = "Lakekeeper 0.15 describes GET .../namespaces/{ns}/functions and POST .../tables/{t}/unregister in its API, but the server answers 404 (not advertised in /v1/config)"
seen_at = { lakekeeper = "0.15.1" }

[lakekeeper-hard-delete-race]
summary = "Spark PURGE races with Lakekeeper's hard delete (intermittent NoSuchKeyException)"
seen_at = { lakekeeper = "0.15.1", spark = "4.1.4+iceberg1.12.0" }
flaky = true

[lakekeeper-ns-properties-missing-field]
summary = "Lakekeeper's update-namespace-properties response lacks the field 'missing' that PyIceberg 0.12 requires (Polaris sends it)"
seen_at = { lakekeeper = "0.15.1", pyiceberg = "0.12.0" }

[lakekeeper-openfga-ignores-token-roles]
summary = "Lakekeeper 0.15 with OpenFGA ignores roles from the token: LAKEKEEPER__OPENID_ROLES_CLAIM is used only by the Cedar authorizer (docs: 'The default OpenFGA implementation does not use token roles') - membership must be granted in Lakekeeper"
seen_at = { lakekeeper = "0.15.1", openfga = "1.23.0" }

[lakekeeper-rejects-geo]
summary = "Lakekeeper v0.15 rejects geometry/geography in table schemas (422)"
seen_at = { lakekeeper = "0.15.1" }

[lakekeeper-signer-refuses-purge]
summary = "Spark PURGE after drop: Lakekeeper's signer refuses deletes for the dropped table"
seen_at = { lakekeeper = "0.15.1", spark = "4.1.4+iceberg1.12.0" }

[lakekeeper-snapshots-param]
summary = "Lakekeeper accepts any value of loadTable's 'snapshots' parameter (spec: all|refs; Unity, Polaris and RustFS answer 400)"
seen_at = { lakekeeper = "0.15.1" }
bug_report = "13-lakekeeper-error-bodies-and-snapshots-param.md"

