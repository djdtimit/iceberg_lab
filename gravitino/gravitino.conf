# Apache Gravitino server of the lab (compose profile gravitino, catalog profile "gravitino").
# Mounted over the image's conf/gravitino.conf; SKIP_CONFIG_REWRITE=true keeps the entrypoint
# from rewriting it (its environment map knows no OAuth keys).
#
# - Server + web UI: 8090 (host 8090). Iceberg REST as auxiliary service: 9001 (host 8186).
# - Authentication: OAuth2 bearer tokens from Keycloak (realm iceberg), checked against its
#   JWKS, the issuer (authority) and the audience "gravitino" (optional scope gravitino).
#   Principal = preferred_username (service-account-<client> for the lab clients); groups =
#   the claim lab_roles.
# - Authorization on: the service admin creates metalake "lab"; whoever creates an object owns
#   it; other users need roles (privileges) in the metalake.
# - Iceberg REST in dynamic-config-provider mode: the warehouse a client asks for names a
#   lakehouse-iceberg catalog of metalake "lab" (created by iceberg_lab.bootstrap); its
#   properties (JDBC backend on Postgres, S3FileIO on RustFS, s3-token vending) live there.

gravitino.server.shutdown.timeout = 3000
gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090
gravitino.server.webserver.minThreads = 24
gravitino.server.webserver.maxThreads = 200
gravitino.server.webserver.stopTimeout = 30000
gravitino.server.webserver.idleTimeout = 30000
gravitino.server.webserver.threadPoolWorkQueueSize = 100
gravitino.server.webserver.requestHeaderSize = 131072
gravitino.server.webserver.responseHeaderSize = 131072

# Entity store (metalakes, catalogs, users, roles): the image's H2 default, on the volume
# mounted at /opt/gravitino/data.
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:h2
gravitino.entity.store.relational.jdbcDriver = org.h2.Driver
gravitino.entity.store.relational.jdbcUser = gravitino
gravitino.entity.store.relational.jdbcPassword = gravitino
gravitino.catalog.cache.evictionIntervalMs = 3600000
gravitino.cache.enabled = true
gravitino.cache.maxEntries = 10000
gravitino.cache.expireTimeInMs = 3600000
gravitino.cache.enableStats = false
gravitino.cache.enableWeigher = true
gravitino.cache.implementation = caffeine
gravitino.fetchFile.blockUnsafeRemoteUri = true

# Authentication: Keycloak as OAuth2 provider.
gravitino.authenticators = oauth
gravitino.authenticator.oauth.provider = oidc
gravitino.authenticator.oauth.tokenValidatorClass = org.apache.gravitino.server.authentication.JwksTokenValidator
gravitino.authenticator.oauth.jwksUri = http://keycloak:8080/realms/iceberg/protocol/openid-connect/certs
gravitino.authenticator.oauth.authority = http://keycloak:8080/realms/iceberg
gravitino.authenticator.oauth.serviceAudience = gravitino
gravitino.authenticator.oauth.principalFields = preferred_username
gravitino.authenticator.oauth.allowSkewSecs = 60
# Groups from the token claim lab_roles (the identity provider's roles, see keycloak.IDP_ROLE):
# a role granted to such a group applies to every token that names it.
gravitino.authenticator.oauth.groupsFields = lab_roles

# Authorization: lab-admin's service account is the service admin.
gravitino.authorization.enable = true
gravitino.authorization.serviceAdmins = service-account-lab-admin

# Iceberg REST (auxiliary service in this server).
gravitino.auxService.names = iceberg-rest
gravitino.iceberg-rest.classpath = iceberg-rest-server/libs, iceberg-rest-server/conf
gravitino.iceberg-rest.host = 0.0.0.0
gravitino.iceberg-rest.httpPort = 9001
gravitino.iceberg-rest.catalog-config-provider = dynamic-config-provider
gravitino.iceberg-rest.gravitino-uri = http://localhost:8090
gravitino.iceberg-rest.gravitino-metalake = lab
