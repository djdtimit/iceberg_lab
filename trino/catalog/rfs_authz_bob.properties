# tests/test_authz.py on RustFS: IAM user "az-bob" (SigV4 for the catalog AND the data files;
# its policy decides what it may read/write - tests/authz_backends.py).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rustfs:9000/iceberg
iceberg.rest-catalog.warehouse=labtables
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.signing-name=s3
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=az-bob
s3.aws-secret-key=az-bob-secret
