# Warehouse "demo-signing": Trino cannot do Iceberg remote signing, so it gets static RustFS keys.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=demo-signing
iceberg.rest-catalog.security=NONE
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=rustfsadmin
s3.aws-secret-key=rustfsadmin
# Lab only: allow expire_snapshots / remove_orphan_files with retention 0s in tests
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
# Multi-level Iceberg namespaces, addressed as schema "parent.child"
iceberg.rest-catalog.nested-namespace-enabled=true
