# Catalog profile 'gravitino' (CATALOG=gravitino): Apache Gravitino's Iceberg REST service,
# tokens from Keycloak (client credentials of lab-admin, scope gravitino), vended credentials.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://gravitino:9001/iceberg
iceberg.rest-catalog.warehouse=gravitino_sts
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/iceberg/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.credential=lab-admin:lab-admin-secret
iceberg.rest-catalog.oauth2.scope=gravitino
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
# Multi-level Iceberg namespaces, addressed as schema "parent.child"
iceberg.rest-catalog.nested-namespace-enabled=true
