# Same warehouse as lk_sts, but through the fault-injecting catalog proxy that
# tests/test_robustness.py runs inside the dev container (port 18181).
# Warehouse "demo-sts": Trino uses the short-lived STS credentials vended by Lakekeeper.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://dev:18181/catalog
iceberg.rest-catalog.warehouse=demo-sts
iceberg.rest-catalog.security=NONE
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
# Lab only: allow expire_snapshots / remove_orphan_files with retention 0s in tests
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
