# tests/test_authz.py on Unity: second instance unitycatalog-authz (authorization on). Keycloak
# client "alice" via unity-token-shim (client credentials -> Unity token, tests/authz_backends.py).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://unitycatalog-authz:8080/api/2.1/unity-catalog/iceberg
iceberg.rest-catalog.warehouse=lab
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=alice:alice-secret
iceberg.rest-catalog.oauth2.server-uri=http://unity-token-shim:8080/token
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
